pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "**/*.{ts,tsx,js}"
      run: pnpm eslint {staged_files}
    - name: typecheck
      run: pnpm tsc --noEmit
    - name: format
      glob: "**/*.{ts,tsx,js,mjs,json,md,yml}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: test
      run: pnpm vitest run
